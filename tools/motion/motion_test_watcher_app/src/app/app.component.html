<div class="relative z-10">
  <mat-toolbar class="bg-blue-500 text-white">
    <span class="font-medium text-lg">Motion Test Watcher</span>
    <span class="flex-auto"></span>

    <div class="font-medium text-lg justify-end">
      <button mat-button color="primary" (click)="openDialog()">
        Get Presubmit Artifacts
      </button>
    </div>
    <div class="button-dropdown-container">
      <test-mode-list [testModes]="testModes" (selectedTestMode)="switchMode($event)" [testMode]="testMode">

      </test-mode-list>
    </div>
  </mat-toolbar>
  <div *ngIf="isVideoPresent" class="absolute w-full justify-end flex">
    <button class="px-2 pt-1 rounded-b-lg bg-gray-300 hover:bg-gray-400 mr-10 relative group"
      (click)="openPreviewComponent()">
      <span class="google-symbols">slideshow</span>
      <span class="
              absolute right-full top-1/2 -translate-y-1/2 mr-2
              px-3 py-1 bg-gray-600 text-gray-100 text-sm font-medium
              rounded-lg whitespace-nowrap opacity-0 pointer-events-none
              transition-opacity duration-300
              group-hover:opacity-100
            ">
        {{showPreviewComponent && isVideoPresent? 'Close Video Panel' : 'Open Video Panel' }}
      </span>
    </button>
  </div>
</div>

<div class="flex h-screen p-2 2xl:p-4 bg-gray-100">
  <div class="flex flex-col py-4 justify-start w-10 bg-slate-200 mx-auto">
    <div (click)="toggleTestListVisibility()"
      class="p-2 mx-auto cursor-pointer rounded hover:bg-gray-400 transition-colors relative group">
      <button>
        <span class="google-symbols">menu</span>
      </button>
      <span class="z-10
              absolute left-full top-1/2 -translate-y-1/2 ml-2
              px-3 py-1 bg-gray-600 text-gray-100 text-sm font-medium
              rounded-lg whitespace-nowrap opacity-0
              transition-opacity duration-300
              group-hover:opacity-100
              pointer-events-none
            ">
        {{ showTestList ? 'Close Test List' : 'Open Test List' }}
      </span>
    </div>
    <div *ngIf="goldens && goldens.length > 0 && goldens[0]?.dataSource===undefined" (click)="toggleCheckBoxes()"
      class="p-2 mx-auto cursor-pointer rounded hover:bg-gray-400 transition-colors relative group">
      <button>
        <span class="google-symbols">check_box</span>
      </button>
      <span class="z-10
              absolute left-full top-1/2 -translate-y-1/2 ml-2
              px-3 py-1 bg-gray-600 text-gray-100 text-sm font-medium
              rounded-lg whitespace-nowrap opacity-0
              transition-opacity duration-300
              group-hover:opacity-100
              pointer-events-none
            ">
        Update Golden
      </span>
    </div>
  </div>
  <div *ngIf="showTestList" [@sidebarMenuAnimation] class="w-1/4 bg-white rounded-r-md overflow-y-auto mr-2 2xl:mr-4">
    <app-test-list [goldens]="goldens" [testMode]="testMode" (refreshRequest)="refreshGoldens($event)"
      (selectedGoldenChange)="setSelectedGolden($event)" [presubmitTests]="presubmitTests"
      (selectedTestNameChange)="setSelectedPresubmitTest($event)" [(showCheckBoxes)]="showCheckBoxes"
      [isRefreshing]="isRefreshing"></app-test-list>
  </div>

  <div class="flex flex-col flex-grow space-y-4" [ngStyle]="{ 'width': showTestList ? '75%' : '90%' }">
    <div class="bg-white rounded-md shadow-md overflow-hidden h-1/3" *ngIf="showPreviewComponent && isVideoPresent"
      [@collapseAnimation]>
      <app-preview [selectedGolden]="selectedGolden"></app-preview>
    </div>
    <div class="bg-white rounded-md shadow-md p-4 overflow-y-auto no-scrollbar"
      [@timelineHeightChange]="(showPreviewComponent && isVideoPresent)">
      <app-timeline [selectedGolden]="selectedGolden" [showTestList]="showTestList" [testMode]="testMode"></app-timeline>
    </div>
  </div>
</div>

<div *ngIf="showLoader"
  class="fixed top-0 left-0 w-screen h-screen bg-black/60 flex flex-col justify-center items-center z-50 text-white">
  <mat-spinner diameter="50"></mat-spinner>
  <p>Loading data...</p>
</div>

<div *ngIf="showProgress" class="fixed top-0 left-0 w-full h-1 bg-blue-500 transition-all duration-300 ease-in-out">
</div>
