<div *ngIf="selectedGolden" class="w-full h-full relative flex flex-col">
  <div class="flex justify-end mb-2" *ngIf="expandedGraphIdx === -1 && !loading && actualData && actualData.features">
    <button mat-stroked-button color="primary" (click)="openFilter()">
      <mat-icon class="mr-1">filter_alt</mat-icon>
      Filter Graphs
    </button>
  </div>
  <div
    class="flex flex-col flex-grow items-stretch bg-white rounded-lg shadow-sm border border-gray-200 p-6 overflow-hidden">
      <app-graph [showTestList]="showTestList" [dataSource]="selectedGolden.dataSource"
        class="flex flex-grow w-full h-full min-h-[400px]"
        *ngIf="expandedGraphIdx !== -1 && !loading"
        [expectedData]="expectedData"
        [actualData]="actualData"
        [featureName]="getSelectedFeatureName()"
        [isExpanded]="true"
        (expand)="toggleGraph($event)"
      ></app-graph>

      <div class="flex flex-col gap-6 overflow-y-auto pr-2"
        *ngIf="expandedGraphIdx === -1 && !loading && actualData && actualData.features">
        <ng-container *ngFor="let feature of actualData.features; let i = index">
          <app-graph [showTestList]="showTestList" [dataSource]="selectedGolden.dataSource"
            *ngIf="shouldDisplayGraph(feature.name)"
            class="h-64 w-full block border border-gray-100 rounded-lg p-2 hover:shadow-md transition-shadow duration-200"
            [expectedData]="expectedData"
            [actualData]="actualData"
            [featureName]="getFeatureName(i)"
            (expand)="toggleGraph($event)"
          >
          </app-graph>
        </ng-container>
      </div>

      <div *ngIf="loading" class="flex flex-col items-center justify-center h-full text-gray-500">
        <mat-spinner [diameter]="40" class="mb-4"></mat-spinner>
        <p>Loading golden data...</p>
      </div>
  </div>

  <div class="mt-4 flex justify-center space-x-4" *ngIf="expandedGraphIdx !== -1">
    <button mat-icon-button (click)="onPrevious()" matTooltip="Previous Graph">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <button mat-icon-button (click)="onNext()" matTooltip="Next Graph">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
  <div *ngIf="showUpdateButton" class="py-4 flex justify-center">
    <button mat-flat-button color="warn" (click)="updateGolden()">
      Update Golden
    </button>
  </div>
</div>

<div *ngIf="!selectedGolden" class="w-full h-full p-4 flex justify-center items-center">
  <p class="text-center text-gray-500">No test selected.</p>
</div>
