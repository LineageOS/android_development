<div class="p-4 bg-gray-50 min-h-[300px]">
  <h2 class="text-xl font-semibold mb-4 text-gray-800">Filter Options</h2>

  <div class="relative w-full max-w-sm mx-auto mb-6">
    <button type="button" class="relative flex justify-between items-center w-full min-h-[40px] px-4 py-2 text-left bg-white border border-gray-300 rounded-lg shadow-sm
             focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent cursor-pointer
             transition-all duration-200 ease-in-out text-gray-700" (click)="toggleDropdown()">
      <span class="block truncate pr-6">{{ selectedDisplayNames }}</span>
      <span class="ml-2 flex items-center pr-2 pointer-events-none">
        <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
          aria-hidden="true">
          <path fill-rule="evenodd"
            d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
            clip-rule="evenodd" />
        </svg>
      </span>
    </button>

    <div *ngIf="isDropdownOpen" class="absolute z-10 mt-1 w-full bg-white shadow-lg rounded-md border border-gray-200
             py-1 max-h-60 overflow-y-auto focus:outline-none opacity-100 scale-100
             transition-opacity transition-transform duration-200 ease-out">
      <div class="sticky top-0 bg-white p-2 border-b border-gray-200 z-20">
        <input type="text" [formControl]="searchControl" placeholder="Search items..."
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 text-gray-800">
      </div>

      <ul class="py-1">
        <li *ngIf="filteredOptions.length === 0" class="px-4 py-2 text-gray-500 text-sm">No results found.</li>
        <li class="px-4 py-2 cursor-pointer hover:bg-gray-100 flex items-center">
          <input class="block w-full py-0 px-0 bg-transparent border-none focus:outline-none focus:ring-0 text-left text-gray-800 flex-grow" type="button" value="Select All" (click)="selectAll()">
        </li>
        <li class="px-4 py-2 cursor-pointer hover:bg-gray-100 flex items-center">
          <input class="block w-full py-0 px-0 bg-transparent border-none focus:outline-none focus:ring-0 text-left text-gray-800 flex-grow" type="button" value="Select None" (click)="selectNone()">
        </li>
        <li class="px-4 py-2 cursor-pointer hover:bg-gray-100 flex items-center">
          <input class="block w-full py-0 px-0 bg-transparent border-none focus:outline-none focus:ring-0 text-left text-gray-800 flex-grow" type="button" value="Select Failing" (click)="selectFailing()">
        </li>
        <li *ngFor="let option of
         filteredOptions" class="px-4 py-2 cursor-pointer hover:bg-gray-100 flex items-center">
          <input type="checkbox" [id]="'checkbox-' + option.id" [checked]="isOptionSelected(option)"
            (change)="onCheckboxChange(option, $event)"
            class="mr-3 h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 cursor-pointer">
          <label [for]="'checkbox-' + option.id" class="text-sm text-gray-800 cursor-pointer flex-grow">{{ option.name
            }}</label>
        </li>
      </ul>
    </div>
  </div>

  <div class="mt-8 p-4 bg-blue-50 rounded-md border border-blue-200">
    <h3 class="font-semibold text-blue-800 mb-2">Selected Items:</h3>
    <p *ngIf="TempselectedItems.length === 0" class="text-blue-700">None selected.</p>
    <ul *ngIf="TempselectedItems.length > 0" class="list-disc pl-5 text-blue-700">
      <li *ngFor="let item of TempselectedItems">{{ item.name }}</li>
    </ul>
  </div>

  <div class="flex justify-end mt-6 space-x-3">
    <button type="button"
      class="px-5 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-300 transition-colors duration-200"
      (click)="cancelFilters()">
      Cancel
    </button>
    <button type="button"
      class="px-5 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-200"
      (click)="applyFilters()">
      Apply Filters
    </button>
  </div>
</div>
