syntax = "proto2";

package winscope.test;

// Message used for testing the fake proto machinery
message RootMessage {
  optional Entry entry = 1;
}

enum Enum0 {
    ENUM0_VALUE_ZERO = 0;
    ENUM0_VALUE_ONE = 1;
}

message NestedMessage {
  optional int32 property = 0;
}

message Entry {
  enum Enum1 {
    ENUM1_VALUE_ZERO = 0;
    ENUM1_VALUE_ONE = 1;
  }
  optional Enum0 enum0 = 1;
  optional Enum1 enum1 = 2;
  repeated int32 array = 3;
  optional int32 number_32bit = 4;
  optional int64 number_64bit = 5;

  optional int64 _case_64bit = 6;
  optional int64 case_64bit = 7;
  optional int64 case_64bit_lsb = 8;
  optional int64 case_64_bit = 9;
  optional int64 case_64_bit_lsb = 10;

  optional bool bool_value = 11;
  optional double double_value = 12;
  optional float float_value = 13;
  optional uint32 uint32_value = 14;
  optional sint32 sint32_value = 15;
  optional fixed32 fixed32_value = 16;
  optional sfixed32 sfixed32_value = 17;
  optional uint64 uint64_value = 18;
  optional sint64 sint64_value = 19;
  optional fixed64 fixed64_value = 20;
  optional sfixed64 sfixed64_value = 21;
  optional string string_value = 22;
  optional bytes bytes_value = 23;

  optional NestedMessage nested_message = 24;
}
