<div class="card-grid">
  <collapsed-sections
    [class.empty]="sections.areAllSectionsExpanded()"
    [sections]="sections"
    (sectionChange)="sections.onCollapseStateChange($event, false)"
  >
  </collapsed-sections>

  @let data = inputData();
  @let currStore = store();

  @if (data !== undefined && data.rectsToDraw !== undefined) {
    <rects-view
      class="rects-view"
      [class.collapsed]="sections.isSectionCollapsed(CollapsibleSectionType.RECTS)"
      [title]="rectsTitle"
      [store]="currStore"
      [isStackBased]="true"
      [dependencies]="data.dependencies"
      [displays]="data.displays"
      [rects]="data.rectsToDraw"
      [shadingModes]="shadingModes"
      [highlightedItem]="data.highlightedRect"
      [userOptions]="data.rectsUserOptions ?? {}"
      [isDarkMode]="data.isDarkMode"
      [rectSpec]="data.rectSpec"
      (collapseButtonClicked)="sections.onCollapseStateChange(CollapsibleSectionType.RECTS, true)"
      (highlightedIdChange)="onHighlightedIdChange.emit($event)"
      (optionsChange)="onRectsUserOptionsChange.emit($event)"
      (rectsDblClick)="onRectsDblClick.emit()"
    ></rects-view>
  }

  <log-view
    class="log-view"
    [class.collapsed]="sections.isSectionCollapsed(CollapsibleSectionType.LOG)"
    [title]="eventLogTitle"
    [selectedIndex]="data?.selectedIndex"
    [scrollToIndex]="data?.scrollToIndex"
    [currentIndex]="data?.currentIndex"
    [entries]="data?.entries ?? []"
    [headers]="data?.headers ?? []"
    [showTraceEntryTimes]="false"
    [showTimeControls]="false"
    [isFetchingData]="data?.isFetchingData ?? false"
    [checkScrollViewportCount]="data?.checkScrollViewportCount ?? 0"
    [heightPredictor]="heightPredictor"
    (collapseButtonClicked)="sections.onCollapseStateChange(CollapsibleSectionType.LOG, true)"
    (logFilterChange)="onLogFilterChange.emit($event)"
    (logEntryClick)="onLogEntryClick.emit($event)"
    (timestampClick)="onTimestampClick.emit($event)"
    (arrowDownPress)="onArrowDownPress.emit()"
    (arrowUpPress)="onArrowUpPress.emit()"
  ></log-view>

  @if (!arePropertiesCollapsed()) {
    <div class="properties">
      <properties-view
        class="properties-view event-properties"
        [class.collapsed]="sections.isSectionCollapsed(CollapsibleSectionType.PROPERTIES)"
        [title]="eventPropertiesTitle"
        [nodeRows]="data?.propertyNodes ?? []"
        [highlightedProperty]="data?.highlightedProperty ?? ''"
        [traceType]="TraceType.INPUT_EVENT_MERGED"
        [store]="currStore"
        [isProtoDump]="true"
        [textFilter]="data?.propertiesFilter"
        placeholderText="No selected entry."
        (collapseButtonClicked)="
          sections.onCollapseStateChange(CollapsibleSectionType.PROPERTIES, true)
        "
        (filterChange)="onPropertiesFilterChange.emit($event)"
        (optionsChange)="onPropertiesUserOptionsChange.emit($event)"
        (highlightedPropertyChange)="onHighlightedPropertyChange.emit($event)"
      ></properties-view>
      <properties-view
        class="properties-view dispatch-properties"
        [class.collapsed]="
          sections.isSectionCollapsed(CollapsibleSectionType.INPUT_DISPATCH_PROPERTIES)
        "
        [title]="dispatchPropertiesTitle"
        [nodeRows]="data?.dispatchPropertyNodes ?? []"
        [highlightedProperty]="data?.highlightedProperty ?? ''"
        [traceType]="TraceType.INPUT_EVENT_MERGED"
        [store]="currStore"
        [isProtoDump]="true"
        [textFilter]="data?.dispatchPropertiesFilter"
        placeholderText="No selected entry."
        (collapseButtonClicked)="
          sections.onCollapseStateChange(CollapsibleSectionType.INPUT_DISPATCH_PROPERTIES, true)
        "
        (filterChange)="onDispatchPropertiesFilterChange.emit($event)"
        (highlightedPropertyChange)="onHighlightedPropertyChange.emit($event)"
      ></properties-view>
    </div>
  }
</div>
