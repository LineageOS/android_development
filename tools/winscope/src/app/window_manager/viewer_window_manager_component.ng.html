<div class="card-grid">
  <collapsed-sections
    [class.empty]="sections.areAllSectionsExpanded()"
    [sections]="sections"
    (sectionChange)="sections.onCollapseStateChange($event, false)"
  >
  </collapsed-sections>

  @let data = inputData();
  @let currStore = store();

  <rects-view
    class="rects-view"
    [class.collapsed]="sections.isSectionCollapsed(CollapsibleSectionType.RECTS)"
    [class.disabled-component]="data?.isPlaybackInitializing"
    [title]="getRectsTitle()"
    [store]="currStore"
    [rects]="data?.rectsToDraw ?? []"
    [displays]="data?.displays ?? []"
    [highlightedItem]="data?.highlightedItem ?? ''"
    [shadingModes]="shadingModes"
    [dependencies]="data?.dependencies ?? []"
    [userOptions]="data?.rectsUserOptions ?? {}"
    [pinnedIds]="pinnedIds()"
    [isDarkMode]="data?.isDarkMode ?? false"
    [rectSpec]="data?.rectSpec"
    (collapseButtonClicked)="sections.onCollapseStateChange(CollapsibleSectionType.RECTS, true)"
    (highlightedIdChange)="onHighlightedIdChange.emit($event)"
    (optionsChange)="onRectsUserOptionsChange.emit($event)"
  ></rects-view>
  <hierarchy-view
    class="hierarchy-view"
    [class.collapsed]="sections.isSectionCollapsed(CollapsibleSectionType.HIERARCHY)"
    [class.disabled-component]="data?.isPlaybackInitializing"
    [nodeRows]="data?.hierarchyNodes ?? []"
    [dependencies]="data?.dependencies ?? []"
    [highlightedItem]="data?.highlightedItem ?? ''"
    [pinnedItems]="data?.pinnedItems ?? []"
    [textFilter]="data?.hierarchyFilter"
    [store]="currStore"
    [userOptions]="data?.hierarchyUserOptions ?? {}"
    [rectIdToShowState]="data?.rectIdToShowState"
    (collapseButtonClicked)="sections.onCollapseStateChange(CollapsibleSectionType.HIERARCHY, true)"
    (filterChange)="onHierarchyFilterChange.emit($event)"
    (highlightedNodeChange)="onHighlightedNodeChange.emit($event)"
    (pinnedItemChange)="onHierarchyPinnedChange.emit($event)"
    (optionsChange)="onHierarchyUserOptionsChange.emit($event)"
    (rectShowStateChange)="onRectShowStateChange.emit($event)"
  ></hierarchy-view>

  <div
    class="properties"
    [class.collapsed]="sections.isSectionCollapsed(CollapsibleSectionType.PROPERTIES)"
    [class.disabled-component]="data?.isPlaybackPlaying || data?.isPlaybackInitializing"
  >
    @if (data?.isPlaybackPlaying) {
      <div class="disabled-message user-notification mat-body-1">
        Properties disabled due to playback
      </div>
    }
    <properties-view
      class="properties-view"
      [class.disabled-component]="data?.isPlaybackPlaying || data?.isPlaybackInitializing"
      [userOptions]="data?.propertiesUserOptions ?? {}"
      [nodeRows]="data?.propertyNodes ?? []"
      [traceType]="TraceType.WINDOW_MANAGER"
      [textFilter]="data?.propertiesFilter"
      [highlightedProperty]="data?.highlightedProperty ?? ''"
      [store]="currStore"
      [isProtoDump]="false"
      placeholderText="No selected item."
      (collapseButtonClicked)="
        sections.onCollapseStateChange(CollapsibleSectionType.PROPERTIES, true)
      "
      (filterChange)="onPropertiesFilterChange.emit($event)"
      (optionsChange)="onPropertiesUserOptionsChange.emit($event)"
      (highlightedPropertyChange)="onHighlightedPropertyChange.emit($event)"
      (timestampClick)="onTimestampClick.emit($event)"
      (propagatePropertyClick)="onPropagatePropertyClick.emit($event)"
    ></properties-view>
  </div>
</div>
