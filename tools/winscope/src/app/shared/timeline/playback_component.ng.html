<div class="playback-controls-container">
  <div class="controls">
    @let state = currentState();
    <button
      mat-icon-button
      class="no-touch-target-button"
      id="start-reverse-playback-button"
      matTooltip="Play backwards"
      (click)="changePlaybackState(PlaybackState.BACKWARDS)"
    >
      <mat-icon
        class="force-icon-flip"
        [class.material-symbols-outlined]="state !== PlaybackState.BACKWARDS"
        [color]="state === PlaybackState.BACKWARDS ? 'primary' : null"
      >
        play_arrow
      </mat-icon>
    </button>
    <button
      mat-icon-button
      class="no-touch-target-button"
      id="pause-playback-button"
      matTooltip="Pause"
      (click)="changePlaybackState(PlaybackState.PAUSED)"
      [disabled]="state === PlaybackState.PAUSED"
    >
      <mat-icon>pause</mat-icon>
    </button>
    <button
      mat-icon-button
      class="no-touch-target-button"
      id="start-playback-button"
      matTooltip="Play forwards"
      (click)="changePlaybackState(PlaybackState.FORWARDS)"
    >
      <mat-icon
        [class.material-symbols-outlined]="state !== PlaybackState.FORWARDS"
        [color]="state === PlaybackState.FORWARDS ? 'primary' : null"
      >
        play_arrow
      </mat-icon>
    </button>
  </div>
  <div class="playback-select">
    <span class="mat-body-1 speed-label"> Speed: </span>
    <mat-form-field
      subscriptSizing="dynamic"
      class="mat-form-field-appearance-none playback-speed-selector no-ripple-field"
    >
      <mat-select
        (selectionChange)="changeSpeed($event)"
        [(value)]="selectedScale"
        panelWidth="80px"
      >
        @for (speed of playbackSpeedSelection; track speed) {
          <mat-option [value]="speed"> {{ speed }} </mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
</div>
